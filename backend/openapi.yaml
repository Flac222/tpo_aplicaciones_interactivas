openapi: 3.1.1
info:
  title: TPO - Aplicaciones Interactivas (API)
  version: 1.1.0
  description: API actualizada con gestión de etiquetas y filtros avanzados.

servers:
  - url: http://localhost:3000
    description: Servidor local de desarrollo

paths:
  /api/status:
    get:
      summary: Estado del sistema
      tags: [Status]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  time:
                    type: string
                    format: date-time
                    example: "2025-11-07T18:00:00Z"

  # ---------- Usuarios ----------
  /api/users/register:
    post:
      summary: Registrar usuario
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCreate"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/login:
    post:
      summary: Login de usuario
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioLogin"
      responses:
        "200":
          description: Login exitoso (token + usuario)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOi..."
                  usuario:
                    $ref: "#/components/schemas/Usuario"
        "400":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me:
    get:
      summary: Obtener perfil del usuario autenticado
      tags: [Usuarios]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil obtenido
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: "#/components/schemas/Usuario"
        "401":
          description: No autenticado

  /api/users/{id}:
    put:
      summary: Actualizar usuario
      tags: [Usuarios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Eliminar usuario
      tags: [Usuarios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          description: Usuario no encontrado

  # ---------- Equipos ----------
  /api/equipos/{userId}:
    post:
      summary: Crear equipo
      tags: [Equipos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipoCreate"
      responses:
        "201":
          description: Equipo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipo"
        "400":
          description: Error en creación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/equipos/equipos/{id}:
    delete:
      summary: Borrar equipo
      tags: [Equipos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Equipo borrado con éxito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericMessage"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/equipos/{equipoId}/invitar:
    post:
      summary: Invitar miembro a un equipo
      tags: [Equipos]
      security:
        - bearerAuth: []
      parameters:
        - name: equipoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["correo"]
              properties:
                correo:
                  type: string
                  format: email
                  example: "nuevo@example.com"
      responses:
        "200":
          description: Miembro invitado / equipo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipo"
        "400":
          description: Error al invitar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/equipos/{equipoId}/salir:
    post:
      summary: Salir de un equipo
      tags: [Equipos]
      security:
        - bearerAuth: []
      parameters:
        - name: equipoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Usuario salió del equipo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  equipo:
                    $ref: "#/components/schemas/Equipo"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/equipos/equipos/{userId}:
    get:
      summary: Listar equipos de un usuario
      tags: [Equipos]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Equipos del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipo"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Tareas ----------
  /api/tareas:
    post:
      summary: Crear tarea
      tags: [Tareas]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TareaCreate"
      responses:
        "201":
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tarea"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tareas/{equipoId}:
    get:
      summary: Listar tareas por equipo con filtros
      tags: [Tareas]
      security:
        - bearerAuth: []
      parameters:
        - name: equipoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: ["Pendiente", "En curso", "Terminada", "Cancelada"]
        - name: prioridad
          in: query
          required: false
          schema:
            type: string
            enum: ["Alta", "Media", "Baja"]
        - name: etiquetaId
          in: query
          description: Filtrar por UUID de etiqueta
          required: false
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Búsqueda de texto en título o descripción
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lista de tareas filtradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tarea"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tareas/{id}/estado:
    put:
      summary: Actualizar estado de tarea
      tags: [Tareas]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TareaEstadoUpdate"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tarea"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tareas/{id}/{userId}:
    delete:
      summary: Eliminar tarea
      tags: [Tareas]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resultado de eliminación
          content:
            application/json:
              schema:
                type: object
                properties:
                  eliminado:
                    type: boolean
        "403":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Etiquetas ----------
  /api/etiquetas/equipos/{equipoId}/etiquetas:
    post:
      summary: Crear nueva etiqueta en un equipo
      tags: [Etiquetas]
      security:
        - bearerAuth: []
      parameters:
        - name: equipoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["nombre"]
              properties:
                nombre:
                  type: string
                  example: "Urgente"
      responses:
        "201":
          description: Etiqueta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etiqueta"
        "400":
          description: Error de validación

    get:
      summary: Listar todas las etiquetas de un equipo
      tags: [Etiquetas]
      security:
        - bearerAuth: []
      parameters:
        - name: equipoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de etiquetas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Etiqueta"

  /api/etiquetas/etiquetas/{etiquetaId}:
    patch:
      summary: Actualizar nombre de etiqueta
      tags: [Etiquetas]
      security:
        - bearerAuth: []
      parameters:
        - name: etiquetaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["nombre"]
              properties:
                nombre:
                  type: string
                  example: "Nuevo Nombre"
      responses:
        "200":
          description: Etiqueta actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etiqueta"
    
    delete:
      summary: Eliminar etiqueta permanentemente
      tags: [Etiquetas]
      security:
        - bearerAuth: []
      parameters:
        - name: etiquetaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Etiqueta eliminada (No Content)
        "400":
          description: Error

  /api/etiquetas/tareas/{tareaId}/etiquetas/{etiquetaId}:
    post:
      summary: Asignar una etiqueta existente a una tarea
      tags: [Etiquetas]
      security:
        - bearerAuth: []
      parameters:
        - name: tareaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: etiquetaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Etiqueta asignada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericMessage"

    delete:
      summary: Remover una etiqueta de una tarea
      tags: [Etiquetas]
      security:
        - bearerAuth: []
      parameters:
        - name: tareaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: etiquetaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Etiqueta removida (No Content)

  /api/etiquetas/tareas/{tareaId}/etiquetas:
    get:
      summary: Listar etiquetas asignadas a una tarea específica
      tags: [Etiquetas]
      security:
        - bearerAuth: []
      parameters:
        - name: tareaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de etiquetas de la tarea
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Etiqueta"

  # ---------- Comentarios ----------
  /api/comentarios/tareas/{tareaId}/comentarios:
    get:
      summary: Listar comentarios de una tarea
      tags: [Comentarios]
      security:
        - bearerAuth: []
      parameters:
        - name: tareaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comentarios de la tarea
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comentario"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Crear comentario en una tarea
      tags: [Comentarios]
      security:
        - bearerAuth: []
      parameters:
        - name: tareaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComentarioCreate"
      responses:
        "201":
          description: Comentario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comentario"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/comentarios/comentarios/{id}:
    put:
      summary: Editar comentario
      tags: [Comentarios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComentarioUpdate"
      responses:
        "200":
          description: Comentario editado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comentario"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/comentarios/{id}:
    delete:
      summary: Eliminar comentario
      tags: [Comentarios]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comentario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericMessage"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---------- Usuarios ----------
    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "9aba693f-2414-402a-9ecd-d3f8479a1b4c"
        nombre:
          type: string
          example: "Ezequiel"
        email:
          type: string
          example: "eze@example.com"

    UsuarioCreate:
      type: object
      required: ["nombre", "email", "password"]
      properties:
        nombre:
          type: string
          example: "Ezequiel2"
        email:
          type: string
          example: "eze4@example.com.ar"
        password:
          type: string
          example: "123456"

    UsuarioLogin:
      type: object
      required: ["email", "password"]
      properties:
        email:
          type: string
          example: "eze4@example.com.ar"
        password:
          type: string
          example: "123456"

    # ---------- Equipos ----------
    Equipo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "9068b2a3-95fd-4e43-a809-8820ba07d2f8"
        nombre:
          type: string
          example: "Equipo Backend"
        propietarioId:
          type: string
          format: uuid
          example: "9aba693f-2414-402a-9ecd-d3f8479a1b4c"
        miembros:
          type: array
          items:
            $ref: "#/components/schemas/Usuario"

    EquipoCreate:
      type: object
      required: ["nombre"]
      properties:
        nombre:
          type: string
          example: "Equipo Backend"
        propietarioId:
          type: string
          format: uuid
          description: "Opcional si se obtiene del token"

    # ---------- Tareas ----------
    Tarea:
      type: object
      properties:
        id:
          type: string
          format: uuid
        titulo:
          type: string
        descripcion:
          type: string
        estado:
          type: string
          enum: ["Pendiente", "En curso", "Terminada", "Cancelada"]
        prioridad:
          type: string
          enum: ["Alta", "Media", "Baja"]
        creadorId:
          type: string
          format: uuid
        equipoId:
          type: string
          format: uuid
          nullable: true
        etiquetas:
          type: array
          items:
            $ref: "#/components/schemas/Etiqueta"
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    TareaCreate:
      type: object
      required: ["titulo", "equipoId"]
      properties:
        titulo:
          type: string
          example: "Implementar login"
        descripcion:
          type: string
          example: "Crear endpoint de login con JWT"
        equipoId:
          type: string
          format: uuid
        prioridad:
          type: string
          enum: ["Alta", "Media", "Baja"]
        estado:
          type: string
          enum: ["Pendiente", "En curso", "Terminada", "Cancelada"]
        etiquetasId:
          type: array
          items:
            type: string
            format: uuid
          description: "Array de IDs de etiquetas para asignar al crear"

    TareaEstadoUpdate:
      type: object
      required: ["nuevoEstado"]
      properties:
        nuevoEstado:
          type: string
          enum: ["Pendiente", "En curso", "Terminada", "Cancelada"]
        usuarioId:
          type: string
          format: uuid
          description: "Opcional, el backend usa el token generalmente"

    # ---------- Etiquetas ----------
    Etiqueta:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: "Urgente"
        equipoId:
          type: string
          format: uuid

    # ---------- Comentarios ----------
    Comentario:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "584c8205-fd90-4088-a838-6ed5e72a9c79"
        tareaId:
          type: string
          format: uuid
        autorId:
          type: string
          format: uuid
        contenido:
          type: string
        fechaCreacion:
          type: string
          format: date-time

    ComentarioCreate:
      type: object
      required: ["contenido"]
      properties:
        contenido:
          type: string
          example: "Este es un comentario de prueba."
        creadorId:
           type: string
           format: uuid
           description: "Opcional, el backend lo toma del token"

    ComentarioUpdate:
      type: object
      required: ["contenido"]
      properties:
        contenido:
          type: string
          example: "Comentario editado."

    # ---------- Utilitarios ----------
    GenericMessage:
      type: object
      properties:
        message:
          type: string
          example: "Operación exitosa"

    DeletedResponse:
      type: object
      properties:
        eliminado:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Mensaje de error explicativo"

tags:
  - name: Status
  - name: Usuarios
  - name: Equipos
  - name: Tareas
  - name: Etiquetas
  - name: Comentarios