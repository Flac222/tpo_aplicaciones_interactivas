openapi: 3.1.1
info:
  title: TPO - Aplicaciones Interactivas (API) - feature/task-watcher
  version: 1.1.0
  description: Endpoints para gestionar watchers de tareas y sus notificaciones.

servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SubscribeWatcherResponse:
      type: object
      properties:
        watcherId:
          type: string
          example: "watcher-123"

    ListTaskWatchersResponseItem:
      type: object
      properties:
        id:
          type: string
          example: "watcher-123"
        userId:
          type: string
          example: "user-456"
        name:
          type: string
          example: "Ana"
        avatar:
          type: string
          example: "A"
        subscribedAt:
          type: string
          format: date-time
          example: "2025-12-10T20:15:00Z"

    WatchlistItemDTO:
      type: object
      properties:
        taskId:
          type: string
          example: "task-789"
        titulo:
          type: string
          example: "Implementar login"
        estado:
          type: string
          example: "EN_CURSO"
        prioridad:
          type: string
          example: "ALTA"
        fechaActualizacion:
          type: string
          format: date-time
          example: "2025-12-09T18:00:00Z"
        subscribedAt:
          type: string
          format: date-time
          example: "2025-12-01T10:00:00Z"

    NotificationItemDTO:
      type: object
      properties:
        id:
          type: string
          example: "notif-123"
        taskId:
          type: string
          example: "task-789"
        titulo:
          type: string
          example: "Implementar login"
        eventType:
          type: string
          example: "COMMENT_EDIT"
        payload:
          type: object
          nullable: true
          example: { comentarioId: "c1", textoNuevo: "Nuevo texto" }
        createdAt:
          type: string
          format: date-time
          example: "2025-12-10T20:15:00Z"

security:
  - bearerAuth: []

paths:
  /tareas/{tareaId}/watchers:
    post:
      summary: Suscribirse a una tarea
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tareaId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Suscripción creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeWatcherResponse"
        "403":
          description: Usuario no pertenece al equipo
        "409":
          description: Ya suscripto
        "422":
          description: Límite de watchers alcanzado

    delete:
      summary: Desuscribirse de una tarea
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tareaId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Suscripción eliminada
        "404":
          description: Suscripción no encontrada

    get:
      summary: Listar watchers de una tarea
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tareaId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de watchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListTaskWatchersResponseItem"

  /users/watchers/watchlist:
    get:
      summary: Obtener watchlist del usuario autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: teamId
          schema:
            type: string
        - in: query
          name: updatedSince
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Watchlist paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WatchlistItemDTO"
                  total:
                    type: integer
                    example: 42

  /notifications:
    get:
      summary: Listar notificaciones no leídas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: taskId
          schema:
            type: string
        - in: query
          name: eventType
          schema:
            type: string
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Lista de notificaciones no leídas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationItemDTO"
                  total:
                    type: integer
                    example: 5

  /notifications/read:
    put:
      summary: Marcar notificaciones como leídas
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
                  description: Si se envía, marca solo las notificaciones de esa tarea
      responses:
        "200":
          description: Cantidad de notificaciones marcadas como leídas
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected:
                    type: integer
                    example: 3
